  <script src="https://cdn.jsdelivr.net/npm/lucide@0.577.0/dist/umd/lucide.min.js"></script>
  <style>
    :root {
      --ink: #06111f;
      --deep: #09182a;
      --navy: #0d2138;
      --paper: #f4ead3;
      --gold: #d8af61;
      --soft-gold: #f4d999;
      --mist: #dfe7ec;
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      width: 100%;
      margin: 0;
      color: var(--paper);
      font-family: "Noto Serif KR", serif;
      overflow-x: hidden;
      background: var(--ink);
    }

    .mobile-invitation {
      width: 100%;
      overflow: hidden;
      position: relative;
      isolation: isolate;
    }

    .hero-scene {
      min-height: calc(100 * min(var(--vh, 1vh), 1vh));
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding: 4.5rem 1.75rem 4rem;
      background: #06111f;
    }

    .hero-scene::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 1;
      background:
        linear-gradient(180deg, rgba(3, 12, 24, 0.35) 0%, rgba(4, 14, 28, 0.64) 48%, rgba(6, 17, 31, 0.95) 100%),
        radial-gradient(circle at 50% 32%, rgba(208, 164, 86, 0.16), transparent 30%);
    }

    .hero-scene::after {
      content: "";
      position: absolute;
      inset: 1.15rem;
      z-index: 3;
      pointer-events: none;
      border: 1px solid rgba(216, 175, 97, 0.38);
    }

    .hero-bokeh {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.56;
      filter: saturate(0.78) contrast(1.05);
      animation: ambientZoom 18s ease-in-out infinite alternate;
    }

    .glow {
      position: absolute;
      border-radius: 999px;
      z-index: 2;
      pointer-events: none;
      background: rgba(246, 205, 116, 0.76);
      filter: blur(2px);
      box-shadow: 0 0 32px 10px rgba(227, 175, 73, 0.22);
      animation: drift 8s ease-in-out infinite alternate;
    }

    .glow-one { width: 13px; height: 13px; top: 15%; left: 11%; animation-delay: -2s; }
    .glow-two { width: 8px; height: 8px; top: 25%; right: 12%; animation-delay: -6s; }
    .glow-three { width: 11px; height: 11px; bottom: 19%; right: 18%; animation-delay: -4s; }
    .glow-four { width: 7px; height: 7px; bottom: 27%; left: 15%; animation-delay: -1s; }

    .evergreen {
      position: absolute;
      z-index: 2;
      width: 12rem;
      height: 12rem;
      opacity: 0.5;
      pointer-events: none;
      background:
        repeating-linear-gradient(135deg, transparent 0 10px, rgba(167, 135, 66, 0.28) 11px 12px, transparent 13px 20px);
      border-radius: 75% 25% 75% 25%;
      filter: blur(0.2px);
    }

    .evergreen-left {
      top: -5.2rem;
      left: -6.8rem;
      transform: rotate(-18deg);
    }

    .evergreen-right {
      bottom: -7rem;
      right: -7rem;
      transform: rotate(145deg);
    }

    .hero-content {
      position: relative;
      z-index: 4;
      width: 100%;
      max-width: 35rem;
      text-align: center;
      padding: 3rem 0 1rem;
    }

    .eyebrow-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      margin-bottom: 1.6rem;
    }

    .eyebrow-wrap::before,
    .eyebrow-wrap::after {
      content: "";
      height: 1px;
      width: clamp(1.6rem, 9vw, 3.6rem);
      background: linear-gradient(90deg, transparent, rgba(216, 175, 97, 0.9));
    }

    .eyebrow-wrap::after {
      transform: rotate(180deg);
    }

    .hero-title-wrap {
      position: relative;
      display: inline-block;
    }

    .hero-title-wrap::after {
      content: "";
      position: absolute;
      height: 1px;
      width: 82%;
      bottom: -1.3rem;
      left: 9%;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
    }

    .star-cluster {
      color: var(--soft-gold);
      font-size: 1.1rem;
      letter-spacing: 1rem;
      margin-top: 3.1rem;
      opacity: 0.9;
    }

    .scroll-mark {
      position: absolute;
      z-index: 4;
      left: 50%;
      bottom: 1.65rem;
      width: 1px;
      height: 3rem;
      background: linear-gradient(to bottom, rgba(216,175,97,0), rgba(216,175,97,0.9));
      animation: breathe 2.6s ease-in-out infinite;
    }

    .reading-section {
      position: relative;
      padding: 7.5rem 1.75rem;
      background:
        radial-gradient(circle at 90% 0%, rgba(177, 136, 62, 0.13), transparent 28rem),
        #09182a;
    }

    .reading-section::before {
      content: "✦";
      position: absolute;
      top: 3.2rem;
      left: calc(50% - 0.45rem);
      color: var(--gold);
      font-size: 1rem;
    }

    .message-frame {
      width: 100%;
      max-width: 35rem;
      margin: 0 auto;
      text-align: center;
    }

    .message-copy {
      white-space: pre-line;
      word-break: keep-all;
    }

    .fine-rule {
      width: 2.6rem;
      height: 1px;
      margin: 2.75rem auto;
      background: var(--gold);
      opacity: 0.78;
    }

    .details-section {
      position: relative;
      padding: 3rem 1.25rem 7.5rem;
      background:
        linear-gradient(180deg, #09182a 0%, #071524 100%);
    }

    .details-card {
      width: 100%;
      max-width: 34rem;
      margin: 0 auto;
      padding: 3.1rem 1.55rem;
      text-align: center;
      border: 1px solid rgba(216, 175, 97, 0.3);
      box-shadow: 0 28px 70px rgba(0, 0, 0, 0.24);
    }

    .details-item + .details-divider-wrap {
      margin: 2.65rem 0;
    }

    .details-divider-line {
      width: 100%;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(216,175,97,0.72), transparent);
    }

    .detail-icon {
      width: 18px;
      height: 18px;
      margin: 0 auto 0.8rem;
      color: var(--gold);
      stroke-width: 1.35;
    }

    .footer-scene {
      position: relative;
      min-height: calc(82 * min(var(--vh, 1vh), 1vh));
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 6rem 1.75rem;
      overflow: hidden;
      text-align: center;
      background:
        radial-gradient(circle at 18% 75%, rgba(210, 163, 77, 0.24), transparent 20rem),
        radial-gradient(circle at 90% 9%, rgba(181, 139, 67, 0.16), transparent 17rem),
        #06111f;
    }

    .footer-scene::before {
      content: "";
      position: absolute;
      inset: 1.3rem;
      border-top: 1px solid rgba(216, 175, 97, 0.34);
      border-bottom: 1px solid rgba(216, 175, 97, 0.34);
      pointer-events: none;
    }

    .footer-content {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 33rem;
    }

    .ornament-ring {
      width: 9rem;
      height: 9rem;
      border: 1px solid rgba(216, 175, 97, 0.19);
      border-radius: 999px;
      position: absolute;
      top: 16%;
      right: -4rem;
      animation: slowSpin 28s linear infinite;
    }

    .ornament-ring::before,
    .ornament-ring::after {
      content: "✦";
      color: var(--gold);
      position: absolute;
      font-size: 0.9rem;
    }

    .ornament-ring::before { top: 0.7rem; left: 1.2rem; }
    .ornament-ring::after { bottom: 0.8rem; right: 1.4rem; }

    .reveal {
      opacity: 0;
      transform: translateY(22px);
      transition: opacity 1.1s ease, transform 1.1s cubic-bezier(.2,.8,.2,1);
    }

    .reveal.is-visible {
      opacity: 1;
      transform: translateY(0);
    }

    .reveal-delay { transition-delay: 0.16s; }
    .reveal-delay-two { transition-delay: 0.3s; }

    @keyframes ambientZoom {
      from { transform: scale(1.02); }
      to { transform: scale(1.1); }
    }

    @keyframes drift {
      from { transform: translate3d(0, 0, 0); opacity: 0.5; }
      to { transform: translate3d(9px, -12px, 0); opacity: 0.9; }
    }

    @keyframes breathe {
      0%, 100% { opacity: 0.25; transform: translateY(0); }
      50% { opacity: 0.92; transform: translateY(8px); }
    }

    @keyframes slowSpin {
      to { transform: rotate(360deg); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
      }
      .reveal { opacity: 1; transform: none; }
    }
  </style>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      lucide.createIcons();

      const revealItems = document.querySelectorAll(".reveal");
      const observer = new IntersectionObserver(function (entries) {
        entries.forEach(function (entry) {
          if (entry.isIntersecting) {
            entry.target.classList.add("is-visible");
            observer.unobserve(entry.target);
          }
        });
      }, { threshold: 0.16 });

      revealItems.forEach(function (item) {
        observer.observe(item);
      });
    });
  </script>
